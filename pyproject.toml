[project]
name = "autorss-feed"
version = "0.1.0"
description = "Self-hosted multi-source feed curator with local-LLM scoring, daily digests, and RAG chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "aioimaplib>=2.0.1",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "edge-tts>=7.2.8",
    "fastapi>=0.136.0",
    "feedparser>=6.0.12",
    "gymnasium>=1.3.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "instaloader>=4.15.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "nltk>=3.9.4",
    "playwright>=1.59.0",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "python-frontmatter==1.1.0",
    "python-multipart>=0.0.28",
    "rouge-score>=0.1.2",
    "simhash>=2.1.2",
    "sqlite-vec>=0.1.9",
    "telethon>=1.43.2",
    "torch>=2.2.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.44.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "gold: opt-in gold-eval regression suite (excluded from default run)",
  "bge_m3_live: opt-in tests requiring a live Ollama bge-m3 backend (autouse stub skipped)",
  "long_ctx: opt-in long-context regression suite (excluded from default run)",
]
addopts = "-m \"not gold and not long_ctx\""

